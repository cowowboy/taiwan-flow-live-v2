name: baseline
# 每交易日收盤後重建 data/baseline.json（5日均額 + 投信/外資近3日買超日數）。
# 三大法人買賣超官方 20:00 台北更新 → 主觸發＝Worker 20:05 台北（2026-07-22 翻轉；
# build_baseline.py 另有 freshness 重試，法人資料未入庫時每 10 分重試最多 40 分，
# 扛官方落地抖動）。本 cron 為備援 21:15 台北。
# Worker 從 repo raw 抓此檔當「資金湧入」偵測的常態基準。
#
# 2026-08-11 起同班順帶增量更新 data/chain_daily/series.json（盤後日頻 RRG 的
# 鏈層日序列，docs/rrg-daily-spec-20260811.md §2 完成定義 4）。掛這班的理由：
# (a) 本班已有 FINMIND_TOKEN；(b) 20:05／21:15 台北遠晚於 FinMind 日線入庫時段
#     （intraday 14:10、daysummary 14:35 都太早，且那兩班沒 token）；
# (c) 本班 commit 後本來就 dispatch pages，chain_daily 搭同一班車即上線。
# 失敗處理比照 intraday.yml 的 rrg base 教訓：絕不擋 baseline.json 的 commit，
# 紅燈延到 commit 之後才發（見最後一步）。
on:
  schedule:
    - cron: '15 13 * * 1-5'   # 週一~五 13:15 UTC = 21:15 台北（備援；主觸發＝Worker 20:05 新鮮度檢查 dispatch，2026-07-22 翻轉）
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # 提交後 dispatch pages 部署

concurrency:
  group: baseline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: build baseline.json
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python src/build_baseline.py
      # 鏈層日頻序列增量更新（缺哪天抓哪天；backtest/cache 被 .gitignore 擋住，
      # CI 上每次約 1~2 個 API 請求）。三種「當天沒新資料」情境共用同一條路：
      # 非交易日、FinMind 當日尚未入庫、單日抓取失敗（builder 印警告後 exit 0）
      # → dates 最新一天不變 → 還原 generated_at-only 變更，不製造無意義 commit，
      # 缺的日期下次執行自動回補（FRESH_GUARD 5 日內不會被誤標休市）。
      # ★ 本步失敗「絕不」擋下面 baseline.json 的 commit：失敗只記 outputs.ok，
      #   還原 data/chain_daily/ 杜絕半寫入被 commit，紅燈延到 commit 之後才發
      #   （見最後一步；同 intraday.yml 的 rrg base 模式）。
      - name: build chain daily
        id: chain
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          before=$(python -c "import json;d=json.load(open('data/chain_daily/series.json'))['dates'];print(d[-1] if d else '')" 2>/dev/null || echo "")
          if python src/build_chain_daily.py; then
            after=$(python -c "import json;d=json.load(open('data/chain_daily/series.json'))['dates'];print(d[-1] if d else '')" 2>/dev/null || echo "")
            if [ "$after" = "$before" ]; then
              echo "chain_daily 無新交易日（最新仍為 ${after:-無}）→ 還原，不 commit"
              git checkout -- data/chain_daily/ 2>/dev/null || true
            fi
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            rc=$?
            echo "::warning::build_chain_daily.py 失敗（exit $rc）→ 還原 data/chain_daily/，"\
                 "不影響 baseline.json；本次 run 會在 commit 之後才轉紅燈"
            git checkout -- data/chain_daily/ 2>/dev/null || true
            echo "ok=0" >> "$GITHUB_OUTPUT"
          fi
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/baseline.json
          if [ -d data/chain_daily ]; then git add data/chain_daily/; fi
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "baseline $(date -u +%FT%TZ)"
          pushed=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then pushed=1; break; fi
            sleep 4
          done
          if [ "$pushed" != "1" ]; then echo "::error::push failed after 5 retries"; exit 1; fi
          # GITHUB_TOKEN 的 push 不會觸發 pages.yml（GitHub 防遞迴），需主動 dispatch 才會部署到網站
          # （data/chain_daily/ 同乘這班：pages.yml 打包整個 repo，有 commit 就一起上線）
          gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
      # 排在 commit 之後才紅燈：讓 chain daily 的失敗看得見（不靜默吞掉），
      # 但此時 baseline.json 已 commit + push 完成，不會被連坐弄丟（同 intraday.yml）。
      - name: chain daily 失敗才轉紅燈
        if: steps.chain.outputs.ok == '0'
        run: |
          echo "::error::build_chain_daily.py 失敗，data/chain_daily/series.json 未更新"\
               "（baseline.json 已照常 commit + push，未受影響）"
          exit 1
