name: cards
# LINE 圖卡 PNG 渲染晚班（spec 3C 呈現層改向）：Worker /cards/data（buildDailyCards 經
# FX_ACTIVE_CARDS 過濾，卡片邏輯唯一來源）→ Pillow 渲染 → commit data/cards/latest/*.png
# ＋ manifest.json → Worker pushDailyCards（台北 22:30 起）抓 manifest，date==今日才掛
# hero 圖；本班失敗／遲到＝當晚自動退純文字 bubble，不擋推播。
#
# 時序依據：留下的 11 張卡來源最晚就緒是 aetfDiff（21:45）與 flows（21:4x），22:12 渲染
# → 22:30 推播剛好；postmkt.json（23:1x 才好）不被任何留下的卡使用，不必等它。
# 2026-08-07 起多一支依賴：pm 摘要（postmkt data/summary/<date>-pm.json，實測 21:2x 落地，
# 對 22:12 有 ~46 分餘裕）。注意 postmkt summary.yml 的 cron 兜底是台北 22:47，晚於本班
# 與推播——哨兵觸發失敗的日子長文卡會靜默缺席（降級正確，但查因要往那邊看）。
# 冪等：整目錄每晚重建（腳本先清 *.png 再寫），重跑無害。
#
# AM slot（2026-08-10 晨間管線）：Worker runMorning 台北 08:05–08:15 dispatch 本檔
# （inputs.slot=am）→ /cards/data?slot=am → data/cards/am/（與晚間 latest/ 分目錄）。
# 晨報 daily-brief-card.json 台北 07:30 前後產出、morning.json 07:1x，08:0x 渲染有充分餘裕；
# AM cron 兜底＝UTC 00:40（台北 08:40，pushMorningCards 窗尾 08:50 前最後機會）。
# cron 觸發無 inputs，slot 由 UTC 小時判斷（0 時=am、14 時=pm，見 decide slot step）。
on:
  schedule:
    - cron: '12 14 * * 1-5'   # 台北 22:12（UTC+8）晚間兜底
    - cron: '40 0 * * 1-5'    # 台北 08:40（UTC+8）晨間兜底
  workflow_dispatch:
    inputs:
      slot:
        description: '渲染場次（pm=盤後、am=晨間）'
        type: choice
        options: [pm, am]
        default: pm

permissions:
  contents: write
  issues: write

concurrency:
  group: cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      # 字型不進 git（兩檔 ~33MB）：cache 命中直接用，未命中才下載
      - name: cache fonts
        id: fontcache
        uses: actions/cache@v4
        with:
          path: fonts
          key: noto-sans-tc-otf-v1
      - name: download Noto Sans TC
        if: steps.fontcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p fonts
          base="https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/TraditionalChinese"
          curl -fsSL -o fonts/NotoSansTC-Bold.otf    "$base/NotoSansCJKtc-Bold.otf"
          curl -fsSL -o fonts/NotoSansTC-Regular.otf "$base/NotoSansCJKtc-Regular.otf"
          # 守門：OTF magic（OTTO）＋尺寸合理，抓到錯誤頁/截斷檔就地失敗，不產豆腐圖
          for f in fonts/NotoSansTC-Bold.otf fonts/NotoSansTC-Regular.otf; do
            [ "$(head -c 4 "$f")" = "OTTO" ] || { echo "::error::$f 非 OTF"; exit 1; }
            [ "$(wc -c < "$f")" -gt 1000000 ] || { echo "::error::$f 檔案過小"; exit 1; }
          done
      # slot 判定：dispatch 帶 inputs.slot；cron 觸發依 UTC 小時（0 時排程=am、14 時排程=pm）。
      # 不比對 github.event.schedule cron 字串（改 cron 容易漏改比對式）；GH schedule 實測
      # 延遲 54 分~2 小時 25 分（見檔頭註解），故 am 判定放寬到 UTC 00–05 時（台北 08–13 時），
      # pm 班（UTC 14:12 起跑）即使延遲 2.5 小時也在 16 時台，不會誤入。
      - name: decide slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            slot="${{ inputs.slot || 'pm' }}"
          else
            hour=$(date -u +%H)
            case "$hour" in
              00|01|02|03|04|05) slot="am" ;;
              *) slot="pm" ;;
            esac
          fi
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "slot=$slot"
      - name: render cards png
        run: python src/build_cards_png.py --slot "${{ steps.slot.outputs.slot }}"
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          dir="data/cards/latest"
          [ "${{ steps.slot.outputs.slot }}" = "am" ] && dir="data/cards/am"
          git add "$dir/"
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "cards png $(date -u +%FT%TZ)"
          pushed=0
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then pushed=1; break; fi
            sleep 4
          done
          if [ "$pushed" != "1" ]; then echo "::error::push failed after 5 retries"; exit 1; fi
          # 不 dispatch pages：PNG 由 raw.githubusercontent 供 LINE hero 引用，網站不吃這批檔
      - name: Notify failure
        # cancelled 也要告警：跑一半被取消（GitHub 端異常或誤按）同樣代表該場沒產出，
        # 而 failure() 在 cancelled 時不成立（2026-07-24 postmkt pm 場靜默消失的教訓）
        if: failure() || cancelled()
        uses: ./.github/actions/notify-failure
        with:
          pipeline: v2-cards
