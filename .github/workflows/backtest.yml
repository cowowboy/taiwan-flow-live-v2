# 守門目的：backtest/run_sorting.py 的產出物 report_sorting.md 是圖卡規格
# （docs/line-cards-spec.md）的唯一回測依據，但 backtest/cache/ 不進 git，
# CI 無法重跑腳本比對。這支跑離線煙霧測試，涵蓋不需要快取就能驗的部分：
#   - 各 run_* 函式的程式路徑走得通、降級分支文案正確
#   - 分位切分的平手率守門與順序無關性（2026-07-26 的不可重現問題）
#   - 已 commit 的 report_sorting.md 九段齊全、各段都有腳本產出的結論行
#     （守 commit f46aaf8 那類「結論行手改進報告、重跑就消失」的回歸）
# 完整的「重跑比對報告」需要 FINMIND_TOKEN 與約 50 分鐘抓快取，見
# docs/line-cards-spec.md 第 8 節「仍待處理」。
# 沿用 canon.yml 的既有原則：不吃任何 secret。
name: backtest

on:
  push:
    paths:
      - 'backtest/**'
      - 'src/build_rrg_base.py'
      - 'docs/line-cards-spec.md'
      - '.github/workflows/backtest.yml'
  pull_request:
    paths:
      - 'backtest/**'
      - 'src/build_rrg_base.py'
      - 'docs/line-cards-spec.md'
      - '.github/workflows/backtest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # src/build_rrg_base.py 不在 backtest/ 底下，但它是 RRG 這條線唯一的離線 builder，
      # 且和 run_rrg.py 共用同一套口徑（K=5、MIN_COVER=0.9、sub→chain 均分）；掛在這裡是
      # 因為本 workflow 已經是「離線、不吃 secret、純語法＋煙霧」的守門，其餘 workflow
      # （aetf/baseline/…）都要 token 或會產生 commit，不適合當語法守門。
      - name: 語法檢查
        run: python -m py_compile backtest/run_sorting.py backtest/test_sorting_smoke.py
             backtest/run_rrg.py backtest/test_rrg_smoke.py src/build_rrg_base.py

      - name: 離線煙霧／回歸測試
        run: python backtest/test_sorting_smoke.py

      # RRG 座標定義的離線煙霧測試（docs/rrg-spec-20260809.md §3「怎麼驗」）
      - name: RRG 離線煙霧測試
        run: python backtest/test_rrg_smoke.py

      # 測試本身刻意不吃 PYTHONHASHSEED，跑兩個 seed 是要證明它不依賴迭代順序。
      # 若哪天有人在 quintile() 又引進順序相依，這一步會抓到。
      - name: 順序無關性（換 hash seed 重跑）
        run: PYTHONHASHSEED=7 python backtest/test_sorting_smoke.py

      # 2026-08-23：本步原本比對「規格引用的行號指向報告的 **結論** 行」，但 80869ade
      # 與 8498bb1 已依「行號在這兩份檔案不可靠」的教訓把規格的引用全改成節名
      # （M1/M3/M4/S1/S2/S3），守門的正規式沒跟著拆 → 抓到 0 列直接 bail，自 run #28
      # 起長紅。改為驗節名：規格引用的節必須在報告中存在，且該節仍有腳本產出的結論行。
      # 守的是同一件事（規格引用不得指空、結論行不得被手改掉），但不隨行號漂移。
      - name: 規格引用的報告節仍存在且有結論行
        run: |
          python - <<'PY'
          import re, sys

          spec = open('docs/line-cards-spec.md', encoding='utf-8').read().split('\n')
          report = open('backtest/report_sorting.md', encoding='utf-8').read().split('\n')

          # 只掃 §3.1 卡別清單那張表。2026-07-29（run #17）曾因正規式沒限縮而把 §9
          # 的表格一起吃進來湊成 7 列誤判，這裡改用章節邊界隔開。
          try:
              start = next(i for i, l in enumerate(spec) if re.match(r'^#{1,6}\s+3\.1\s', l))
          except StopIteration:
              sys.exit('FAIL: docs/line-cards-spec.md 找不到「3.1 卡別清單」章節標題')
          end = next((i for i in range(start + 1, len(spec)) if re.match(r'^#{1,6}\s', spec[i])),
                     len(spec))
          table = '\n'.join(spec[start:end])

          # 表格列：| N | 卡名 | 篩選條件 | 排序 | 節名 |
          rows = re.findall(r'^\|\s*(\d)\s*\|([^|]+)\|[^|]*\|[^|]*\|([^|]+)\|\s*$', table, re.M)
          if len(rows) != 6:
              sys.exit(f'FAIL: §3.1 卡別清單應有 6 列，實際找到 {len(rows)}')

          # 報告的一級節：「# S1. 跌破20日新低分層排序」→ key 'S1'，內容到下一個一級節為止
          # （## / ### 是子節，仍算在同一節內）。
          sections, cur = {}, None
          for l in report:
              h = re.match(r'^#\s+([A-Za-z0-9]+)\.', l)
              if h:
                  cur = h.group(1)
                  sections[cur] = []
              elif re.match(r'^#\s', l):
                  cur = None
              elif cur:
                  sections[cur].append(l)

          bad = []
          for num, name, ref in rows:
              # 去掉 ⚠、空白、粗體等修飾，只留節代號
              key = re.sub(r'[^A-Za-z0-9]', '', ref)
              if key not in sections:
                  bad.append(f'  卡{num} {name.strip()} → 引用「{ref.strip()}」不是報告的節'
                             f'（報告現有節：{"／".join(sections)}）')
              elif not any(l.startswith('**結論**') for l in sections[key]):
                  bad.append(f'  卡{num} {name.strip()} → 節 {key} 沒有腳本產出的 **結論** 行')

          if bad:
              sys.exit('FAIL: 規格引用的報告節已失效\n' + '\n'.join(bad)
                       + '\n修法：對照 grep -n "^# " backtest/report_sorting.md 的節名'
                         '更新規格 §3.1 表格末欄；結論行只能由 run_sorting.py 產生，'
                         '不得手改。')
          print('OK: 6 張卡引用的報告節都存在且各有結論行 → '
                + '／'.join(re.sub(r'[^A-Za-z0-9]', '', r[2]) for r in rows))
          PY
