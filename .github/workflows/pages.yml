name: pages
# 以 GitHub Actions 部署 Pages（取代 legacy Jekyll builder，後者對本 repo 一直 errored）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  # 連續 push 改「排隊」不取消：cancel-in-progress 會在 upload 後取消舊 run，
  # 殘留的 artifact 讓後續 deploy-pages 撞 "Multiple artifacts named github-pages"（2026-07-02 連炸 #17-#25）
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 固定抓 main 最新：資料 workflow push 後隨即 dispatch，run 綁定的 SHA 可能慢一步
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: pages-${{ github.run_id }}   # 每 run 唯一名，杜絕同名 artifact 衝突
      # Pages 後端偶發 "Deployment failed, try again later"（07-05/07-06 多次），失敗等 30 秒重試一次
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: pages-${{ github.run_id }}
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_id }}
      # ⚠ 同 us.yml：concurrency group 為 pages、cancel-in-progress: false，
      # 連續 push／dispatch 時佇列中較舊的 run 會被 GitHub 取消（正常行為），
      # 會觸發本告警。
      - name: Notify failure
        # cancelled 也要告警：跑一半被取消（GitHub 端異常或誤按）同樣代表該場沒產出，
        # 而 failure() 在 cancelled 時不成立（2026-07-24 postmkt pm 場靜默消失的教訓）
        if: failure() || cancelled()
        uses: ./.github/actions/notify-failure
        with:
          pipeline: v2-pages
