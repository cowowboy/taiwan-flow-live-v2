name: worker-deploy

# Worker 自動部署（2026-08-11 新增）。
#
# 為什麼要有這支：先前 12 支 workflow 裡沒有任何一支部署 Worker，只有它是手動
# `cd worker && npm run deploy`。後果是雲端 session 改完 Worker 只能 push、無法完成交付，
# 每次都要使用者在本機補跑一次（2026-08-10 的 version 0ad82dc4 就是這樣上線的）。
#
# 閘門：`test/*.mjs` 全部（glob，新增測試自動納入、不寫死支數）過才部署。
# 這個 Worker 是全系統排程觸發中樞
# （哨兵／新聞班／晨報班／晚場班，五個站都依賴），壞掉會打掉整條排程鏈，所以不設「測試
# 失敗仍部署」的旁路。但要知道測試是離線 mock，擋得住語法錯誤與邏輯回歸，擋不住
# 「mock 對但 workerd 實際行為不同」的問題（例：AbortSignal.timeout 在 workerd 的行為）。
#
# 需要的 repo secrets（Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_API_TOKEN   Cloudflare「Edit Cloudflare Workers」範本產生的 token
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare Account ID（wrangler.toml 未寫 account_id，故需此項）
# 兩者缺一會在最前面就明確報錯，不會跑到一半才失敗。
#
# 觸發：push 到 main 且動到 worker/**，或手動 dispatch。
# 只改測試檔也會觸發一次無異動的重新部署——刻意保留，等於順帶驗證整條部署鏈仍通。

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/worker-deploy.yml'
  workflow_dispatch:

# 同時只允許一個部署，且不取消進行中的那個（部署到一半被砍比排隊更糟）
concurrency:
  group: worker-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - name: 檢查 secrets 是否齊備
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$CF_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CF_ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::缺少 repo secret：$missing"
            echo "設定位置：Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "secrets 齊備"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: 安裝相依
        run: npm ci

      - name: 跑全部離線測試（test/*.mjs 全部；npm test 只跑 parity 一支）
        run: |
          fail=0
          for f in test/*.mjs; do
            echo "--- $f ---"
            if node "$f"; then :; else
              echo "::error::$f 失敗"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::有測試未通過，不部署"
            exit 1
          fi
          echo "全部測試通過"

      - name: 部署 Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          # wrangler 的輸出含 "Current Version ID: <uuid>"，抓出來供回報與記錄
          ver=$(grep -oE 'Version ID: [0-9a-f-]+' deploy.log | tail -1 | awk '{print $3}')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "部署完成，Version ID: ${ver:-（未能從輸出解析）}"

      - name: 寫進 run summary
        if: always()
        run: |
          {
            echo "## Worker 部署"
            echo ""
            echo "- commit: \`${GITHUB_SHA:0:7}\`"
            echo "- Version ID: \`${{ steps.deploy.outputs.version }}\`"
            echo ""
            echo "版本記錄慣例見 PROJECT_SUMMARY.md（每次 deploy 留 version）。"
          } >> "$GITHUB_STEP_SUMMARY"
